<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Snake: Play Safe, Learn More</title>
  <desc id="description">A neon-green pixel snake and fruit on a dark arcade grid.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101a16"/>
      <stop offset="1" stop-color="#070b09"/>
    </linearGradient>
    <linearGradient id="snake" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d7ff8a"/>
      <stop offset="1" stop-color="#71e84b"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b7ff5a" stroke-opacity=".08"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#background)"/>
  <rect width="1200" height="320" rx="28" fill="url(#grid)"/>
  <circle cx="915" cy="105" r="130" fill="#70e84b" opacity=".08"/>
  <g filter="url(#glow)" fill="url(#snake)">
    <rect x="805" y="195" width="48" height="48" rx="12"/>
    <rect x="853" y="195" width="48" height="48" rx="12"/>
    <rect x="901" y="195" width="48" height="48" rx="12"/>
    <rect x="901" y="147" width="48" height="48" rx="12"/>
    <rect x="901" y="99" width="48" height="48" rx="12"/>
    <rect x="949" y="99" width="48" height="48" rx="12"/>
    <rect x="997" y="99" width="48" height="48" rx="12"/>
  </g>
  <circle cx="1075" cy="76" r="17" fill="#ff7b67"/>
  <path d="M1075 58c1-11 8-17 18-17" fill="none" stroke="#b7ff5a" stroke-linecap="round" stroke-width="5"/>
  <circle cx="1069" cy="72" r="3" fill="#fff3db"/>
  <g fill="#b7ff5a">
    <rect x="74" y="74" width="10" height="10" rx="3"/>
    <rect x="92" y="74" width="10" height="10" rx="3" opacity=".6"/>
    <rect x="110" y="74" width="10" height="10" rx="3" opacity=".3"/>
  </g>
  <text x="74" y="148" fill="#f3f7f0" font-family="Segoe UI,Arial,sans-serif" font-size="48" font-weight="800" letter-spacing="-2">SNAKE</text>
  <text x="74" y="190" fill="#b7ff5a" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="5">PLAY SAFE. LEARN MORE.</text>
  <text x="74" y="232" fill="#aab8ad" font-family="Segoe UI,Arial,sans-serif" font-size="16">A game showcase with a lesson in download safety.</text>
  <rect x="74" y="263" width="164" height="2" rx="1" fill="#b7ff5a" opacity=".75"/>
</svg>
